# 把持・配置タスク (image): 置き場所ランダムのスクリプトデモ（A' と同じ条件）を、俯瞰カメラ画像つきで収録し直したもの。
# 観測は関節角 + 画像のみ（物体位置・置き場所は入れず、方策が画像から読み取る。A 案）
bag_dir:                        # 複数指定で順に連結
  - "/home/ubuntu/dataset/rosbags/pick_place_image"
output_dir: "/home/ubuntu/dataset/lerobot_dataset/crane_plus_pick_image"
config: "configs/pick/features_image.py"
target_freq: 20                 # カメラは 10Hz なので、画像は 2 フレームずつ同じものになる（直前の画像を使う）
pad_to_longest: true

# 学習・推論で共通の関節順（名前で並べ替える）。最後がグリッパ
joint_order:
  - crane_plus_joint1
  - crane_plus_joint2
  - crane_plus_joint3
  - crane_plus_joint4
  - crane_plus_joint_hand

topics:
  joint_states: /joint_states
  arm_command: /crane_plus_arm_controller/joint_trajectory
  gripper_command: /crane_plus_gripper_controller/joint_trajectory
  overhead: /task/camera/image  # observation.images の各カメラ名 → 画像トピック

observation:
  state: [joints]
  environment_state: []         # 物体位置・置き場所は入れない
  images: [overhead]            # 特徴量 observation.images.overhead
