# 把持・配置タスク (image) 関節角 + 俯瞰カメラ画像の学習設定（A 案）。ステップ数などは A'（train_objpos_placerand_latch.yaml）と同じ
dataset_root: "/home/ubuntu/dataset/lerobot_dataset/crane_plus_pick_image"
repo_id: "crane_plus_pick_image"
output_directory: "/home/ubuntu/checkpoints/train/crane_plus_pick_image_act"
config_path: "configs/pick/features_image.py"

device: "cuda"
seed: 0
wandb_mode: "disabled"          # wandb を使う場合は online（要 pixi run wandb login）
wandb_project: "pai_crane_pick"
episodes: null                  # 学習に使うエピソード（null で全て）

training_steps: 80000
log_freq: 200
num_workers: 8                  # 画像（動画）のデコードがあるので低次元のモデルより多め
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.0001
chunk_size: 16
n_action_steps: 1               # 推論時は毎ステップ再計画（演習と同じ）

# データセットは 20fps。行動チャンクは現在 (0.0s) から 16 ステップ先 (0.75s) まで
delta_timestamps:
  observation.images.overhead: [0.0]
  observation.state: [0.0]
  action: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75]

# ACTConfig への追加引数。画像の backbone は ImageNet 学習済み ResNet18（LeRobot の既定）、学習率は 1e-5
act: {}
