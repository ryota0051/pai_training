# 把持・配置タスク: 人手デモのみ、観測に「物体 − 手先」の相対位置を追加（実験11）
bag_dir: "/home/ubuntu/dataset/rosbags/pick_place_human"
output_dir: "/home/ubuntu/dataset/lerobot_dataset/crane_plus_pick_objpos_human_rel"
config: "configs/pick/features_objpos_rel.py"
target_freq: 20
pad_to_longest: false          # 混合版（mixhuman）と条件を揃える

# 学習・推論で共通の関節順（名前で並べ替える）。最後がグリッパ
joint_order:
  - crane_plus_joint1
  - crane_plus_joint2
  - crane_plus_joint3
  - crane_plus_joint4
  - crane_plus_joint_hand

topics:
  joint_states: /joint_states
  arm_command: /crane_plus_arm_controller/joint_trajectory
  gripper_command: /crane_plus_gripper_controller/joint_trajectory
  object_pose: /task/object_pose

observation:
  state: [joints]
  environment_state: [object_xyz, object_minus_ee]   # 物体位置 ＋ 物体 − 手先（順運動学）

# object_minus_ee の手先位置の計算（順運動学）
kinematics:
  package: "/home/ubuntu/final_task/ros2_ws/src/crane_plus_kinematics"
  config: "/home/ubuntu/final_task/ros2_ws/src/crane_plus_kinematics/config/kinematics.yaml"
