# 2 クラスの検出器（物体・置き場所）の評価（実験12）。学習に使っていない画像で位置誤差を測る
model_dir: "/home/ubuntu/checkpoints/detector/rtdetr_dr_v2"
dataset_dir: "/home/ubuntu/dataset/detector/dr_v2_test"
pai_task_env_path: "/home/ubuntu/final_task/ros2_ws/src/pai_task_env"     # カメラモデル・逆算（ROS 非依存）を流用
camera_config: "/home/ubuntu/final_task/ros2_ws/src/pai_task_env/config/camera.yaml"
